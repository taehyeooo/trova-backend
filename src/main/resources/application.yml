server:
  port: 8080

spring:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            # openid를 절대 추가하지 말 것: OIDC 경로(OidcUserService)로 로그인이 처리되면서
            # CustomOAuth2UserService가 통째로 건너뛰어져 사용자 upsert가 조용히 동작하지 않게 된다.
            scope: email, profile
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Kakao
            scope: profile_nickname, profile_image
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  pipeline:
    script-path: ${PIPELINE_SCRIPT_PATH:pipeline-test/run_pipeline.py}
    work-dir: ${PIPELINE_WORK_DIR:pipeline-test/work}
    gemini-api-key: ${GEMINI_API_KEY:}
