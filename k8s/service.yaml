# NodePort로 직접 노출 — Traefik/ServiceLB 활성화 여부와 무관하게 동작한다.
# 나중에 도메인/HTTPS를 붙일 때는 Traefik을 켜고 Ingress로 바꾸는 걸 고려할 것.
apiVersion: v1
kind: Service
metadata:
  name: trova-backend
spec:
  type: NodePort
  selector:
    app: trova-backend
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
