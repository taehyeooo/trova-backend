# 복사해서 k8s/secret.yaml로 저장하고 실제 값을 채운 뒤 사용하세요.
# secret.yaml은 .gitignore에 등록되어 있어 커밋되지 않습니다.
apiVersion: v1
kind: Secret
metadata:
  name: trova-backend-secrets
type: Opaque
stringData:
